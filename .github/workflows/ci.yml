name: CI

on:
  push:
    branches: [main, develop, release]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

env:
  BUILD_JOBS: '4'
  TEST_JOBS: '2'

jobs:
  checks:
    name: Source and script checks
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck openjdk-17-jdk
          # Hash-pinned: the build backend first, then the rest without build isolation so the
          # sdist-only parsec cannot fetch unpinned build tools (scripts/ci/requirements-*.in).
          python -m pip install --require-hashes -r scripts/ci/requirements-build.txt
          python -m pip install --require-hashes --no-build-isolation -r scripts/ci/requirements-checks.txt
      - name: C++ style
        run: bash scripts/check_style.sh
      - name: Shell scripts and symlinks
        if: ${{ !cancelled() }}
        run: |
          bash scripts/chk_shellscripts/chk_shellscripts.sh
          bash scripts/check_symlinks.sh
      - name: Spelling
        if: ${{ !cancelled() }}
        run: |
          codespell \
            --skip '*.enc,.git,build,build/*,*/build/*,cmake-build-*,cmake-build-*/*,*/_deps/*,Dockerfile*,LICENSE,codespell_whitelist.txt,codespell_ignored_lines.txt' \
            --ignore-words scripts/codespell_whitelist.txt \
            --exclude-file scripts/codespell_ignored_lines.txt
      - name: Error codes
        if: ${{ !cancelled() }}
        run: python scripts/error_codes.py --check
      - name: Python script tests
        if: ${{ !cancelled() }}
        run: python test/pyscriptTests.py
      - name: Changed optimizer proofs
        if: ${{ !cancelled() }}
        env:
          PROOF_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: bash scripts/run_proofs.sh
      - name: ANTLR grammar
        if: ${{ !cancelled() }}
        run: bash scripts/test_antlr_grammar.sh

  linux:
    name: Linux (${{ matrix.compiler }}, ${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        architecture: [amd64]
        include:
          - compiler: gcc
            architecture: arm64
    uses: ./.github/workflows/linux.yml
    with:
      compiler: ${{ matrix.compiler }}
      architecture: ${{ matrix.architecture }}
      # Keep solver snapshots on one reference image; every native build runs semantic tests.
      run-smt: ${{ matrix.compiler == 'gcc' && matrix.architecture == 'amd64' }}

  portable:
    name: ${{ matrix.platform }} build and tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos
            compiler: build/hypc/hypc
            tests: build/test/hyptest
            asset: hypc-macos
          - os: windows-2022
            platform: windows
            compiler: build/hypc/Release/hypc.exe
            tests: build/test/Release/hyptest.exe
            asset: hypc-windows.exe
    outputs:
      sha256_macos: ${{ steps.release.outputs.sha256_macos }}
      sha256_windows: ${{ steps.release.outputs.sha256_windows }}
    env:
      HYPTEST_BINARY: ${{ matrix.tests }}
      HYPTEST_FLAGS: --no-smt
    steps:
      - name: Preserve fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      # Release binaries are built from pristine inputs: a tag run would otherwise restore these
      # trees from the main-branch cache scope, which any push to main can write.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.ref_type != 'tag'
        with:
          path: |
            deps/boost
            deps/cmake
            ~/.hunter
          key: deps-${{ matrix.os }}-${{ hashFiles('scripts/install_deps.ps1', 'scripts/ci/install_macos_deps.sh', 'scripts/ci/build_qrvmone.sh', 'scripts/ci/cmake/**') }}
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          python -m pip install --require-hashes -r scripts/ci/requirements-cmake.txt
          bash scripts/ci/install_macos_deps.sh
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install_deps.ps1
      - name: Use pinned CMake on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"$env:GITHUB_WORKSPACE/deps/cmake/bin" >> $env:GITHUB_PATH'
      - name: Prepare compiler version
        run: bash scripts/ci/prepare_metadata.sh
      - name: Check out QRVM test engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: theQRL/qrvmone
          ref: bf6e26e7e205605be9e17e44fe2b83f0e193f571 # v0.12.1
          path: deps/qrvmone
          submodules: recursive
          persist-credentials: false
      - name: Build QRVM test engine
        run: bash scripts/ci/build_qrvmone.sh
      - name: Build macOS compiler
        if: runner.os == 'macOS'
        run: |
          # Match the warning compatibility flag used by the Emscripten Clang build.
          export CMAKE_OPTIONS="-DBoost_ROOT=$PWD/deps/boost -DBoost_NO_SYSTEM_PATHS=ON -DUSE_Z3=OFF -DUSE_CVC4=OFF -DCMAKE_CXX_FLAGS=-Wno-unqualified-std-cast-call"
          bash scripts/ci/build.sh
      - name: Build Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/build_win.ps1
      - name: Compiler tests (default and optimized)
        run: bash scripts/ci/hyptest_all.sh
      - name: macOS command-line tests
        if: runner.os == 'macOS'
        run: bash test/cmdlineTests.sh --no-smt
      - name: Generate bytecode comparison
        env:
          COMPILER: ${{ matrix.compiler }}
          PLATFORM: ${{ matrix.platform }}
        run: python scripts/ci/bytecode_report.py "$COMPILER" "reports/$PLATFORM.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bytecode-${{ matrix.platform }}
          path: reports/*.json
          if-no-files-found: error
      - name: Prepare release binary
        id: release
        env:
          COMPILER: ${{ matrix.compiler }}
          ASSET: ${{ matrix.asset }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p release
          cp "$COMPILER" "release/$ASSET"
          # Only this job sets its outputs; the bytecode and release jobs check the artifact against it.
          echo "sha256_$PLATFORM=$(cmake -E sha256sum "release/$ASSET" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.platform }}
          path: test_results/
          if-no-files-found: ignore

  # Python test tooling stays out of the jobs that build release binaries (CIPH-HYPERION-31): the
  # checks job runs the script tests on Linux, this job on macOS and Windows.
  scripts:
    name: Python script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - name: Preserve fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Python script tests
        run: |
          python -m pip install --require-hashes -r scripts/ci/requirements-build.txt
          python -m pip install --require-hashes --no-build-isolation -r scripts/ci/requirements-tests.txt
          python test/pyscriptTests.py

  # The language server tests import PyPI packages, so they test the released Linux binaries here
  # rather than inside the jobs that build them (CIPH-HYPERION-31).
  lsp:
    name: Language server tests (${{ matrix.architecture }})
    needs: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-22.04
            asset: hypc-static-linux
          - architecture: arm64
            runner: ubuntu-22.04-arm
            asset: hypc-static-linux-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-linux-${{ matrix.architecture }}
          path: release
      - name: Install test tools
        run: |
          python -m pip install --require-hashes -r scripts/ci/requirements-build.txt
          python -m pip install --require-hashes --no-build-isolation -r scripts/ci/requirements-tests.txt
      - name: Language server tests
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          chmod +x "release/$ASSET"
          python test/lsp.py "release/$ASSET" --non-interactive

  # The release build above uses a pinned runner, Boost and CMake. This job builds on the newest
  # macOS runner with Homebrew's current Boost and the runner's CMake, so a new Xcode, libc++, Boost
  # or CMake breaks here before it reaches a release (CIPH-HYPERION-36). It publishes nothing.
  macos-latest:
    name: macOS latest toolchain build and tests
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      HYPTEST_BINARY: build/test/hyptest
      HYPTEST_FLAGS: --no-smt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install current Boost and Ninja
        run: brew install boost ninja
      - name: Show toolchain
        run: |
          sw_vers
          xcrun clang++ --version
          cmake --version
          brew list --versions boost ninja
      - name: Prepare compiler version
        run: bash scripts/ci/prepare_metadata.sh
      # Keep this pin equal to the portable job's and linux.yml's, and test/qrvmc on the engine's QRVMC
      # (see test/qrvmc/README.md).
      - name: Check out QRVM test engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: theQRL/qrvmone
          ref: bf6e26e7e205605be9e17e44fe2b83f0e193f571 # v0.12.1
          path: deps/qrvmone
          submodules: recursive
          persist-credentials: false
      - name: Build QRVM test engine
        run: bash scripts/ci/build_qrvmone.sh
      - name: Build compiler
        run: |
          export CMAKE_OPTIONS="-G Ninja -DUSE_Z3=OFF -DUSE_CVC4=OFF -DCMAKE_CXX_FLAGS=-Wno-unqualified-std-cast-call"
          bash scripts/ci/build.sh
      - name: Compiler tests (default and optimized)
        run: bash scripts/ci/hyptest_all.sh

  emscripten:
    name: WebAssembly build and hypc-js tests
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    container:
      # Keep this digest in sync with scripts/build_emscripten.sh.
      image: solbuildpackpusher/solidity-buildpack-deps@sha256:19fcb5ac029bbc27ec36e10f7d14ea224d8010145f9690562ef084fd16146b0c
    outputs:
      sha256: ${{ steps.release.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust checkout in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build packed WebAssembly compiler
        run: bash scripts/ci/build_emscripten.sh
      # Recorded before hypc-js and its npm dependencies run in this job. Only this job sets its
      # outputs; the bytecode and release jobs check the artifact against this digest.
      - name: Record release asset digest
        id: release
        run: echo "sha256=$(sha256sum upload/hypjson.js | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check out JavaScript bindings
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: theQRL/hypc-js
          ref: fdef38670119db396c558bd3bda87f64c4246fef
          path: deps/hypc-js
          persist-credentials: false
      - name: Test this build with hypc-js
        run: |
          cp upload/hypjson.js deps/hypc-js/hypjson.js
          cd deps/hypc-js
          npm ci
          npm version --no-git-tag-version --allow-same-version "$(../../scripts/get_version.sh)"
          npm test
      - name: Generate bytecode comparison
        run: python3 scripts/ci/bytecode_report.py deps/hypc-js/dist reports/emscripten.json --hypcjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bytecode-emscripten
          path: reports/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-emscripten
          path: upload/hypjson.js
          if-no-files-found: error

  bytecode:
    name: Compare native and WebAssembly bytecode
    needs: [linux, portable, emscripten]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bytecode-*
          path: reports
          merge-multiple: true
      - name: Require matching reports from every build
        run: |
          for platform in linux-gcc linux-clang linux-gcc-arm64 macos windows emscripten; do
            test -s "reports/$platform.json"
            diff -u reports/linux-gcc.json "reports/$platform.json"
          done
      # The release job's asset check, run on every push and pull request so that a missing digest
      # fails here rather than at release time.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Check release assets against their build jobs
        env:
          BUILT_SHA256SUMS: |
            ${{ needs.linux.outputs.sha256_amd64 }}  hypc-static-linux
            ${{ needs.linux.outputs.sha256_arm64 }}  hypc-static-linux-arm
            ${{ needs.portable.outputs.sha256_macos }}  hypc-macos
            ${{ needs.portable.outputs.sha256_windows }}  hypc-windows.exe
            ${{ needs.emscripten.outputs.sha256 }}  hypjson.js
        run: |
          cd release
          sha256sum hypc-static-linux hypc-static-linux-arm hypc-macos hypc-windows.exe hypjson.js |
            diff -u <(printf '%s' "$BUILT_SHA256SUMS") -

  # Runs first on a tag push, so a bad tag is visible before anyone approves the release.
  tag:
    name: Verify release tag
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Require a signed, annotated tag on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/ci/verify_release_tag.sh

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [checks, linux, portable, emscripten, bytecode, lsp, scripts, tag]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Waits for a second maintainer: the environment has required reviewers, blocks self-review and
    # admin bypass, and only accepts v* tags (CIPH-HYPERION-28, CIPH-HYPERION-29).
    environment: release
    permissions:
      contents: write # create the GitHub release and upload its assets (scripts/ci/publish_release.sh)
      id-token: write # mint the OIDC token that signs the build provenance attestation
      attestations: write # store the build provenance attestation for each release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      # Any job in this run can replace an artifact, but only the job that built an asset sets that
      # job's outputs, so SHA256SUMS must equal the digests the build jobs recorded.
      - name: Verify assets and calculate checksums
        env:
          BUILT_SHA256SUMS: |
            ${{ needs.linux.outputs.sha256_amd64 }}  hypc-static-linux
            ${{ needs.linux.outputs.sha256_arm64 }}  hypc-static-linux-arm
            ${{ needs.portable.outputs.sha256_macos }}  hypc-macos
            ${{ needs.portable.outputs.sha256_windows }}  hypc-windows.exe
            ${{ needs.emscripten.outputs.sha256 }}  hypjson.js
        run: |
          cd release
          for asset in hypc-static-linux hypc-static-linux-arm hypc-macos hypc-windows.exe hypjson.js; do
            test -s "$asset"
          done
          chmod +x hypc-static-linux hypc-static-linux-arm hypc-macos
          sha256sum hypc-static-linux hypc-static-linux-arm hypc-macos hypc-windows.exe hypjson.js > SHA256SUMS
          diff -u <(printf '%s' "$BUILT_SHA256SUMS") SHA256SUMS
      # Signed SLSA build provenance binding each asset to this workflow run and commit;
      # consumers verify with `gh attestation verify <file> --repo theQRL/hyperion
      # --signer-workflow theQRL/hyperion/.github/workflows/ci.yml`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/hypc-static-linux
            release/hypc-static-linux-arm
            release/hypc-macos
            release/hypc-windows.exe
            release/hypjson.js
            release/SHA256SUMS
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/ci/publish_release.sh release
