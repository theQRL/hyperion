name: Linux build and tests

on:
  workflow_call:
    inputs:
      compiler:
        type: string
        default: gcc
      architecture:
        type: string
        default: amd64
      sanitizer:
        type: string
        default: ''
      run-smt:
        type: boolean
        default: true
    outputs:
      sha256_amd64:
        description: SHA-256 of the amd64 release binary, set by the gcc build
        value: ${{ jobs.linux.outputs.sha256_amd64 }}
      sha256_arm64:
        description: SHA-256 of the arm64 release binary, set by the gcc build
        value: ${{ jobs.linux.outputs.sha256_arm64 }}

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ inputs.compiler }} ${{ inputs.architecture }} ${{ inputs.sanitizer }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 120
    container:
      # AMD64 images include Boost and Z3 4.12.1. ARM64 uses buildpack-deps:jammy
      # with the same dependencies installed below; all images use Ubuntu 22.04.
      image: ${{ inputs.architecture == 'arm64' && 'buildpack-deps@sha256:b42a097e9ba880d3e3e2345ea52306ab6862926392a00150afc9e43437808cfe' || inputs.compiler == 'clang' && 'solbuildpackpusher/solidity-buildpack-deps@sha256:538596bf55961197f8b5670d8a6742d9bcd502b6a1045ae9d372cdf35ce69d93' || 'solbuildpackpusher/solidity-buildpack-deps@sha256:4df420b7ccd96f540a4300a4fae0fcac2f4d3f23ffff9e3777c1f2d7c37ef901' }}
    defaults:
      run:
        shell: bash
    outputs:
      sha256_amd64: ${{ steps.release.outputs.sha256_amd64 }}
      sha256_arm64: ${{ steps.release.outputs.sha256_arm64 }}
    env:
      CC: ${{ inputs.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ inputs.compiler == 'clang' && 'clang++' || 'g++' }}
      BUILD_JOBS: '4'
      TEST_JOBS: '2'
      HYPTEST_FLAGS: ${{ !inputs.run-smt && '--no-smt' || '' }}
      SANITIZER: ${{ inputs.sanitizer }}
      PLATFORM: linux-${{ inputs.compiler }}${{ inputs.architecture == 'arm64' && '-arm64' || '' }}
      RELEASE_ASSET: hypc-static-linux${{ inputs.architecture == 'arm64' && '-arm' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust checkout in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # No PyPI packages in a release-building job (CIPH-HYPERION-31): the command-line tests and the
      # bytecode report use only the standard library, and ci.yml's lsp job runs the language server tests.
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ccache python3
      - name: Install ARM64 build dependencies
        if: inputs.architecture == 'arm64'
        run: |
          apt-get install -y --no-install-recommends cmake ninja-build jq locales-all \
            libboost-filesystem-dev libboost-test-dev libboost-system-dev libboost-program-options-dev
      # Release binaries are built from pristine inputs: tag runs restore no caches, because a tag
      # run would otherwise read the main-branch cache scope, which any push to main can write.
      - name: Cache ARM64 solver
        if: inputs.architecture == 'arm64' && github.ref_type != 'tag'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps/z3
          key: z3-ubuntu22.04-${{ inputs.architecture }}-${{ inputs.compiler }}-${{ hashFiles('scripts/ci/build_z3.sh', '.github/workflows/linux.yml') }}
      - name: Build ARM64 solver
        if: inputs.architecture == 'arm64'
        run: bash scripts/ci/build_z3.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.ref_type != 'tag'
        with:
          path: |
            .ccache
            ~/.hunter
          key: linux-${{ inputs.architecture }}-${{ inputs.compiler }}-${{ inputs.sanitizer }}-${{ hashFiles('cmake/**', '.github/workflows/linux.yml') }}-${{ github.sha }}
          restore-keys: linux-${{ inputs.architecture }}-${{ inputs.compiler }}-${{ inputs.sanitizer }}-${{ hashFiles('cmake/**', '.github/workflows/linux.yml') }}-
      - name: Check out QRVM test engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: theQRL/qrvmone
          ref: bf6e26e7e205605be9e17e44fe2b83f0e193f571 # v0.12.1
          path: deps/qrvmone
          submodules: recursive
          persist-credentials: false
      - name: Build QRVM test engine
        run: bash scripts/ci/build_qrvmone.sh
      - name: Build compiler
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CMAKE_OPTIONS='-DUSE_CVC4=OFF -DHYPC_STATIC_STDLIBS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache'
          if [[ -d deps/z3 ]]; then
            export CMAKE_OPTIONS="$CMAKE_OPTIONS -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/deps/z3"
          fi
          if [[ -n "$SANITIZER" ]]; then
            export CMAKE_OPTIONS="$CMAKE_OPTIONS -DSANITIZE=$SANITIZER"
          fi
          bash scripts/ci/build.sh
          build/hypc/hypc --version
      - name: Compiler tests (default and optimized)
        run: bash scripts/ci/hyptest_all.sh
      - name: Command-line tests
        run: |
          test_args=()
          if [[ "$HYPTEST_FLAGS" == --no-smt ]]; then
            test_args+=(--no-smt)
          fi
          bash test/cmdlineTests.sh "${test_args[@]}"
      - name: Generate bytecode comparison
        if: inputs.sanitizer == ''
        run: python3 scripts/ci/bytecode_report.py build/hypc/hypc "reports/${PLATFORM}.json"
      - name: Upload bytecode comparison
        if: inputs.sanitizer == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bytecode-${{ env.PLATFORM }}
          path: reports/*.json
          if-no-files-found: error
      - name: Prepare Linux release binary
        id: release
        if: inputs.compiler == 'gcc' && inputs.sanitizer == ''
        env:
          EXPECTED_MACHINE: ${{ inputs.architecture == 'arm64' && 'AArch64' || 'Advanced Micro Devices X86-64' }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          mkdir -p release
          cp build/hypc/hypc "release/$RELEASE_ASSET"
          strip "release/$RELEASE_ASSET"
          readelf -h "release/$RELEASE_ASSET" | grep -F "$EXPECTED_MACHINE"
          readelf -h "release/$RELEASE_ASSET" | grep -F ELF64
          "release/$RELEASE_ASSET" --version
          if ldd "release/$RELEASE_ASSET" | grep -E 'libboost|libstdc\+\+|libgcc_s|libz3|libcvc4'; then
            echo 'Release binary unexpectedly depends on an unbundled runtime library.' >&2
            exit 1
          fi
          # Only this job sets its outputs; ci.yml's bytecode and release jobs check the artifact against it.
          echo "sha256_$ARCHITECTURE=$(sha256sum "release/$RELEASE_ASSET" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload Linux release binary
        if: inputs.compiler == 'gcc' && inputs.sanitizer == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-${{ inputs.architecture }}
          path: release/${{ env.RELEASE_ASSET }}
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ env.PLATFORM }}-${{ inputs.sanitizer || 'regular' }}
          path: test_results/
          if-no-files-found: ignore
